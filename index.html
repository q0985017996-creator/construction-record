<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>施工紀錄</title>
<meta name="theme-color" content="#07090c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="施工紀錄">

<style>
:root{--bg:#07090c;--card:#12161b;--line:#2b3037;--text:#f3f5f7;--muted:#a8afb8;--blue:#4387e8;--green:#4fa56f;--red:#d45f59;--yellow:#c5b94e;--purple:#aa7bd2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{max-width:720px;margin:auto;padding-bottom:90px}.top{position:sticky;top:0;z-index:10;background:#07090ced;backdrop-filter:blur(12px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.toprow{display:flex;justify-content:space-between;align-items:center}.yearbtn,.roundbtn{background:#191e25;color:white;border:1px solid #303741;border-radius:999px}.yearbtn{padding:12px 17px;font-weight:800;font-size:18px}.roundbtn{width:45px;height:45px;font-size:25px}.monthtitle{font-size:48px;font-weight:850;margin:14px 0 0 4px;letter-spacing:-2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}.week div{text-align:center;padding:11px 0;color:#c4cad1;font-weight:800}
.calendar{display:grid;grid-template-columns:repeat(7,1fr)}.day{height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 5px;position:relative;overflow:hidden}.day:nth-child(7n){border-right:0}.day.blank{opacity:.25}.day.active{cursor:pointer}.day.selected{background:#111820}.date{font-size:21px;font-weight:800;padding-left:2px}.selected .date{display:flex;width:34px;height:34px;border-radius:50%;background:#e9504b;align-items:center;justify-content:center;padding:0}.events{margin-top:5px;display:flex;flex-direction:column;gap:3px}.event{border-radius:999px;padding:4px 5px;font-size:10px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.e0{background:#37360e;color:#d6ce62}.e1{background:#3b1e1d;color:#e98a83}.e2{background:#123728;color:#7fcea2}.e3{background:#2d203b;color:#c79ce5}.more{font-size:10px;color:#aab3bc;padding-left:4px}.sum{position:absolute;bottom:5px;right:5px;font-size:9px;color:#77aef2}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#12171df2;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px env(safe-area-inset-right) calc(8px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}.nav button{background:transparent;color:#8f99a4;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;padding:5px}.nav .active{color:#79adff}.nav .plus{background:var(--blue);color:white;width:52px;height:52px;border-radius:50%;font-size:27px;margin-top:-28px;border:5px solid var(--bg)}
.sheetbg{display:none;position:fixed;inset:0;background:#0009;z-index:30}.sheetbg.show{display:flex;align-items:flex-end}.sheet{width:100%;max-height:88vh;overflow:auto;background:#12171d;border-radius:24px 24px 0 0;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}.handle{width:48px;height:5px;background:#59616a;border-radius:5px;margin:0 auto 15px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:0;font-size:24px}.close{background:#252b33;color:#fff;border-radius:50%;width:39px;height:39px;font-size:24px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:14px 0}.stat{background:#1b2129;border-radius:11px;padding:10px}.stat small{display:block;color:#aeb7c0}.stat b{font-size:18px}.record{background:#1a2027;border:1px solid #303943;border-radius:14px;padding:13px;margin:9px 0}.recordtop{display:flex;justify-content:space-between;gap:8px}.record h3{margin:0;font-size:18px}.people{font-size:13px;color:#b9c2cb;margin:6px 0}.cost{font-size:13px;color:#dce2e7;line-height:1.8}.subtotal{color:#74cb91;font-weight:800;font-size:17px}.actions{display:flex;gap:7px;margin-top:10px}.edit,.save,.addsite{background:#3977ce;color:white;border-radius:9px;padding:9px 13px;font-weight:800}.delete{background:#4b2526;color:#ffaaa5;border-radius:9px;padding:9px 13px}
.form{margin-top:12px;padding-top:14px;border-top:1px solid var(--line);display:none}.form.show{display:block}.field{margin-bottom:11px}.field label{display:block;color:#b8c0c9;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#090d12;color:#fff;border:1px solid #39424c;border-radius:10px;padding:11px;font-size:16px}.field textarea{min-height:68px}.checklist{display:flex;flex-wrap:wrap;gap:7px}.checklist label{background:#242b34;padding:8px 10px;border-radius:9px;font-size:14px}.checklist input{width:auto;margin-right:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save{width:100%;padding:14px;font-size:16px}.empty{color:#9ba5af;text-align:center;padding:25px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#1d252e;color:#fff;border:1px solid #3a4652;border-radius:999px;padding:11px 18px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:99;box-shadow:0 8px 30px #0008}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.ok{background:#173b29;border-color:#327654}.toast.wait{background:#23334b;border-color:#4d78b6}.save:disabled{opacity:.65;cursor:wait}
.listpage,.managepage{padding:16px;display:none}.listitem{background:#161c23;border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px;cursor:pointer}.listitem b{font-size:17px}.listmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.listmeta .people{grid-column:1/-1;font-size:13px;color:#aeb7c0;padding-bottom:3px}.costbox{font-size:12px;color:#aeb7c0;line-height:1.45}.costbox strong{display:block;font-size:14px;color:#eef3f7}.costbox.meal strong{color:#77d58a}.costbox.hardware strong{color:#73aef7}.costbox.transport strong{color:#f5a33c}.costbox.toll strong{color:#d89bff}.listtotal{margin-top:10px;padding-top:9px;border-top:1px solid #2a3038;text-align:right;font-size:14px;color:#aeb7c0}.listtotal strong{font-size:16px;color:#fff;margin-left:6px}.managecard{background:#151b22;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:13px}.managecard h2{margin-top:0}.manageitem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2a3038}
</style>
</head>
<body>
<div class="app">
<section id="calPage">
<div class="top"><div class="toprow"><button class="yearbtn" onclick="moveMonth(-1)">‹ <span id="year"></span></button><div><button class="roundbtn" onclick="moveMonth(1)">›</button></div></div><div class="monthtitle" id="month"></div></div>
<div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div class="calendar" id="calendar"></div>
</section>
<section id="listPage" class="listpage"></section>
<section id="managePage" class="managepage"></section>
</div>
<div id="toast" class="toast"></div><nav class="nav"><button class="active" onclick="switchPage('calPage',this)">▦<span>月曆</span></button><button onclick="switchPage('listPage',this);renderList()">☷<span>紀錄</span></button><button class="plus" onclick="openDay(selectedDate||today())">＋</button><button onclick="switchPage('managePage',this);renderManage()">⚙<span>設定</span></button></nav>

<div class="sheetbg" id="sheetbg" onclick="if(event.target===this)closeSheet()"><div class="sheet"><div class="handle"></div><div class="sheethead"><h2 id="sheetTitle"></h2><button class="close" onclick="closeSheet()">×</button></div><div class="stats" id="stats"></div><div id="recordBox"></div><button class="addsite" style="width:100%;margin-top:8px" onclick="showForm()">＋ 新增施工紀錄</button>
<div class="form" id="form"><h3 id="formTitle">新增施工紀錄</h3><input type="hidden" id="rid"><div class="field"><label>日期</label><input type="date" id="fdate"></div><div class="field"><label>施工地點</label><select id="fsite"></select><input style="margin-top:7px" id="newsite" placeholder="或輸入新案場"></div><div class="field"><label>施工人員（可複選）</label><div class="checklist" id="fpeople"></div></div><div class="grid2"><div class="field"><label>🍱 餐費</label><input type="number" id="fmeal" min="0" value="0"></div><div class="field"><label>🥤 飲料</label><input type="number" id="fdrink" min="0" value="0"></div><div class="field"><label>🔩 五金</label><input type="number" id="fhardware" min="0" value="0"></div><div class="field"><label>🚗 車資</label><input type="number" id="fcar" min="0" value="0"></div><div class="field"><label>🛣️ 過路費</label><input type="number" id="ftoll" min="0" value="0"></div></div><div class="field"><label>🧾 其他費用</label><input type="number" id="fother" min="0" value="0"></div><div class="field"><label>備註</label><textarea id="fnote"></textarea></div><button class="save" onclick="saveRecord()">💾 儲存施工紀錄</button></div>
</div></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxWtIPdn-O5CXJ9ueyo867K5ux5D9F0IEmJ5FYYf8Eh3Rl99CELPEwW4UL0Bn_GDEd4/exec';
let people=[], sites=[], records=[];
let view=new Date(),selectedDate=null,editing=false,loading=false;
const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function total(r){return (+r.meal||0)+(+r.drink||0)+(+r.hardware||0)+(+r.car||r.transport||0)+(+r.toll||0)+(+r.other||0)}
async function apiGet(action){const r=await fetch(API_URL+'?action='+encodeURIComponent(action),{cache:'no-store'});const j=await r.json();if(!j.success)throw new Error(j.message||'讀取失敗');return j.data}
async function apiPost(data){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});const j=await r.json();if(!j.success)throw new Error(j.message||'儲存失敗');return j}
async function loadCloud(show=true){if(loading)return;loading=true;try{const d=await apiGet('all');people=(d.workers||[]).map(x=>typeof x==='string'?x:x.name);sites=(d.sites||[]).map(x=>typeof x==='string'?x:x.name);records=(d.records||[]).map(r=>({...r,people:r.people||r.workers||[],car:r.car??r.transport??0,toll:+r.toll||0}));renderCalendar();if(selectedDate&&$('sheetbg').classList.contains('show'))renderDay();if($('listPage').style.display==='block')renderList();if($('managePage').style.display==='block')renderManage()}catch(e){console.error(e);if(show)alert('⚠️ 無法連接 Google 雲端：'+e.message)}finally{loading=false}}
function renderCalendar(){let y=view.getFullYear(),m=view.getMonth();$('year').textContent=y+'年';$('month').textContent=(m+1)+'月';let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),grid='';for(let i=0;i<first;i++)grid+='<div class="day blank"></div>';for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,rs=records.filter(r=>r.date===date),events=rs.slice(0,3).map((r,i)=>`<div class="event e${i%4}"><span>●</span>${esc(r.site)}</div>`).join('');if(rs.length>3)events+=`<div class="more">＋${rs.length-3} 筆</div>`;let sum=rs.reduce((a,r)=>a+total(r),0);grid+=`<div class="day active ${date===selectedDate?'selected':''}" onclick="openDay('${date}')"><div class="date">${d}</div><div class="events">${events}</div>${rs.length?`<div class="sum">$${sum.toLocaleString()}</div>`:''}</div>`}$('calendar').innerHTML=grid}
function moveMonth(n){view.setMonth(view.getMonth()+n);selectedDate=null;renderCalendar()}
async function switchPage(id,btn){['calPage','listPage','managePage'].forEach(x=>$(x).style.display=x===id?'block':'none');document.querySelectorAll('.nav button:not(.plus)').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');await loadCloud(false)}
async function openDay(date){await loadCloud(false);selectedDate=date;$('sheetbg').classList.add('show');$('sheetTitle').textContent=date.replaceAll('-',' / ');$('form').classList.remove('show');renderCalendar();renderDay()}
function closeSheet(){$('sheetbg').classList.remove('show');$('form').classList.remove('show')}
function renderDay(){let rs=records.filter(r=>r.date===selectedDate),food=rs.reduce((a,r)=>a+(+r.meal||0)+(+r.drink||0),0),hw=rs.reduce((a,r)=>a+(+r.hardware||0),0),car=rs.reduce((a,r)=>a+(+r.car||0),0),toll=rs.reduce((a,r)=>a+(+r.toll||0),0),sum=rs.reduce((a,r)=>a+total(r),0);$('stats').innerHTML=`<div class="stat"><small>施工筆數</small><b>${rs.length} 筆</b></div><div class="stat"><small>餐飲費</small><b>$${food.toLocaleString()}</b></div><div class="stat"><small>五金</small><b>$${hw.toLocaleString()}</b></div><div class="stat"><small>車資＋過路費</small><b>$${(car+toll).toLocaleString()}</b></div><div class="stat"><small>當日總支出</small><b>$${sum.toLocaleString()}</b></div>`;$('recordBox').innerHTML=rs.length?rs.map(r=>`<div class="record"><div class="recordtop"><h3>📍 ${esc(r.site)}</h3><b class="subtotal">$${total(r).toLocaleString()}</b></div><div class="people">👷 ${(r.people||[]).map(esc).join('、')||'未選擇人員'}</div><div class="cost">🍽️ 餐飲費 $${((+r.meal||0)+(+r.drink||0)).toLocaleString()}<br>🔩 五金 $${(+r.hardware||0).toLocaleString()}　🚗 車資 $${(+r.car||0).toLocaleString()}　🛣️ 過路費 $${(+r.toll||0).toLocaleString()}<br>🧾 其他 $${(+r.other||0).toLocaleString()}${r.note?'<br>📝 '+esc(r.note):''}</div><div class="actions"><button class="edit" onclick="editRecord('${r.id}')">✏️ 編輯</button><button class="delete" onclick="deleteRecord('${r.id}')">刪除</button></div></div>`).join(''):'<div class="empty">這一天還沒有施工紀錄</div>'}
function showForm(){editing=false;$('formTitle').textContent='新增施工紀錄';$('rid').value='';$('fdate').value=selectedDate||today();$('fsite').innerHTML='<option value="">請選擇案場</option>'+sites.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('newsite').value='';$('fpeople').innerHTML=people.map(p=>`<label><input type="checkbox" value="${esc(p)}">${esc(p)}</label>`).join('');['fmeal','fdrink','fhardware','fcar','ftoll','fother'].forEach(x=>$(x).value=0);$('fnote').value='';$('form').classList.add('show');$('form').scrollIntoView({behavior:'smooth'})}
function editRecord(id){let r=records.find(x=>String(x.id)===String(id));if(!r)return;editing=true;$('formTitle').textContent='✏️ 編輯施工紀錄';$('rid').value=r.id;$('fdate').value=r.date;$('fsite').innerHTML='<option value="">請選擇案場</option>'+sites.map(s=>`<option value="${esc(s)}" ${s===r.site?'selected':''}>${esc(s)}</option>`).join('');$('newsite').value=sites.includes(r.site)?'':r.site;$('fpeople').innerHTML=people.map(p=>`<label><input type="checkbox" value="${esc(p)}" ${(r.people||[]).includes(p)?'checked':''}>${esc(p)}</label>`).join('');$('fmeal').value=r.meal||0;$('fdrink').value=r.drink||0;$('fhardware').value=r.hardware||0;$('fcar').value=r.car||0;$('ftoll').value=r.toll||0;$('fother').value=r.other||0;$('fnote').value=r.note||'';$('form').classList.add('show');$('form').scrollIntoView({behavior:'smooth'})}
function showToast(msg,type='wait',ms=0){const t=$('toast');t.textContent=msg;t.className='toast show '+type;if(ms)setTimeout(()=>{if(t.textContent===msg)t.className='toast'},ms)}
async function saveRecord(){let site=$('newsite').value.trim()||$('fsite').value;if(!site)return alert('請選擇或輸入施工地點');let record={id:$('rid').value||undefined,date:$('fdate').value,site,workers:[...$('fpeople').querySelectorAll('input:checked')].map(x=>x.value),meal:+$('fmeal').value||0,drink:+$('fdrink').value||0,hardware:+$('fhardware').value||0,transport:+$('fcar').value||0,toll:+$('ftoll').value||0,other:+$('fother').value||0,note:$('fnote').value.trim()};if(!record.date)return alert('請選擇日期');const btn=document.querySelector('#form .save');try{if(btn){btn.disabled=true;btn.textContent='⏳ 儲存中…'}showToast('⏳ 正在同步到 Google 雲端…','wait');$('form').classList.remove('show');if(!sites.includes(site))await apiPost({action:'addSite',name:site});const result=await apiPost({action:record.id?'updateRecord':'addRecord',record});if(!record.id&&result&&result.id)record.id=result.id;selectedDate=record.date;await loadCloud(false);showToast('✓ 已同步到 Google 雲端','ok',2400)}catch(e){showToast('⚠️ 儲存失敗，請重試','wait',3500);alert('⚠️ 儲存失敗：'+e.message)}finally{if(btn){btn.disabled=false;btn.textContent='💾 儲存施工紀錄'}}}
async function deleteRecord(id){if(!confirm('確定刪除這筆施工紀錄？'))return;try{await apiPost({action:'deleteRecord',id});await loadCloud(false)}catch(e){alert('⚠️ 刪除失敗：'+e.message)}}
function renderList(){let arr=[...records].sort((a,b)=>b.date.localeCompare(a.date));$('listPage').innerHTML='<h2>施工紀錄</h2>'+(arr.length?arr.map(r=>{const meal=(+r.meal||0)+(+r.drink||0),hardware=(+r.hardware||0),transport=(+r.car||+r.transport||0),toll=(+r.toll||0),people=(r.people||r.workers||[]).join('、')||'未填';return `<div class="listitem" onclick="openDay('${r.date}')"><b>${r.date}｜${esc(r.site)}</b><div class="listmeta"><div class="people">👷 ${esc(people)}</div><div class="costbox meal">🍽️ 餐飲費<strong>$${meal.toLocaleString()}</strong></div><div class="costbox hardware">🔧 五金<strong>$${hardware.toLocaleString()}</strong></div><div class="costbox transport">🚗 車資<strong>$${transport.toLocaleString()}</strong></div><div class="costbox toll">🛣️ 過路費<strong>$${toll.toLocaleString()}</strong></div></div><div class="listtotal">總計<strong>$${total(r).toLocaleString()}</strong></div></div>`}).join(''):'<div class="empty">尚無施工紀錄</div>')}
function renderManage(){$('managePage').innerHTML=`<div class="managecard"><h2>👷 施工人員</h2><div class="grid2"><input id="np" placeholder="新增人員"><button class="edit" onclick="addPerson()">新增</button></div>${people.map((p,i)=>`<div class="manageitem">${esc(p)}<button class="delete" onclick="deletePerson(${i})">刪除</button></div>`).join('')}</div><div class="managecard"><h2>📍 施工案場</h2><div class="grid2"><input id="ns" placeholder="新增案場"><button class="edit" onclick="addSite()">新增</button></div>${sites.map((s,i)=>`<div class="manageitem">${esc(s)}<button class="delete" onclick="deleteSite(${i})">刪除</button></div>`).join('')}</div>`}
async function addPerson(){let v=$('np').value.trim();if(!v)return;try{await apiPost({action:'addWorker',name:v});await loadCloud(false)}catch(e){alert(e.message)}}
async function addSite(){let v=$('ns').value.trim();if(!v)return;try{await apiPost({action:'addSite',name:v});await loadCloud(false)}catch(e){alert(e.message)}}
async function deletePerson(i){try{const id=(await apiGet('workers'))[i]?.id;if(id){await apiPost({action:'deleteWorker',id});await loadCloud(false)}}catch(e){alert(e.message)}}
async function deleteSite(i){try{const id=(await apiGet('sites'))[i]?.id;if(id){await apiPost({action:'deleteSite',id});await loadCloud(false)}}catch(e){alert(e.message)}}
renderCalendar();loadCloud();
</script></script><script>
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadCloud(false)});
window.addEventListener('focus',()=>loadCloud(false));
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
</script>
</body></html>
